version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meta_org_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  security-kernel:
    build:
      context: .
      dockerfile: security-kernel/Dockerfile
    environment:
      SECURITY_KERNEL_PORT: "8090"
      SECURITY_KERNEL_SHARED_SECRET: "dev-security-kernel-shared-secret"
      RUST_LOG: "info"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/meta_org_saas?sslmode=disable"
      PLATFORM_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/meta_org_saas?sslmode=disable"
      TENANT_DATABASE_ADMIN_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      TENANT_DATABASE_NAME_PREFIX: "meta_org_"
      JWT_SECRET: "dev-secret-change-in-production"
      MODEL_SECRET_KEY: "0123456789abcdef0123456789abcdef"
      CORS_ORIGINS: "http://localhost:3000"
      MIGRATIONS_PATH: "migrations"
      META_ORG_MODE: "saas"
      META_ORG_DISTRIBUTION_MODE: "saas"
      META_ORG_LICENSE_MODE: "commercial"
      SECURITY_KERNEL_URL: "http://security-kernel:8090"
      SECURITY_KERNEL_SHARED_SECRET: "dev-security-kernel-shared-secret"
      SECURITY_KERNEL_ENFORCEMENT_MODE: "blocking"
    depends_on:
      postgres:
        condition: service_healthy
      security-kernel:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      - backend

volumes:
  pgdata:
