services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meta_org_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  security-kernel:
    build:
      context: .
      dockerfile: security-kernel/Dockerfile
    environment:
      SECURITY_KERNEL_PORT: "8090"
      SECURITY_KERNEL_SHARED_SECRET: "dev-security-kernel-shared-secret"
      SECURITY_KERNEL_MAX_CLOCK_SKEW_SECONDS: "60"
      SECURITY_KERNEL_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/meta_org_saas?sslmode=disable"
      RUST_LOG: "info"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/meta_org_saas?sslmode=disable"
      PLATFORM_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/meta_org_saas?sslmode=disable"
      TENANT_DATABASE_ADMIN_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      TENANT_DATABASE_NAME_PREFIX: "meta_org_"
      TENANT_DATABASE_POOL_MAX_ENTRIES: "16"
      TENANT_DATABASE_POOL_MAX_CONNECTIONS: "4"
      TENANT_DATABASE_POOL_MIN_CONNECTIONS: "0"
      TENANT_DATABASE_POOL_IDLE_SECONDS: "900"
      TENANT_DATABASE_POOL_SWEEP_SECONDS: "60"
      TENANT_DATABASE_CONNECTION_IDLE_SECONDS: "300"
      TENANT_DATABASE_CONNECTION_LIFETIME_SECONDS: "1800"
      TENANT_PROVISIONING_WORKER_ENABLED: "true"
      TENANT_PROVISIONING_POLL_SECONDS: "2"
      TENANT_PROVISIONING_LEASE_SECONDS: "1800"
      TENANT_PROVISIONING_RETRY_SECONDS: "5"
      TENANT_PROVISIONING_RETRY_MAX_SECONDS: "900"
      TENANT_PROJECTION_WORKER_ENABLED: "true"
      TENANT_PROJECTION_POLL_SECONDS: "2"
      TENANT_PROJECTION_LEASE_SECONDS: "60"
      TENANT_PROJECTION_RETRY_SECONDS: "5"
      TENANT_PROJECTION_BATCH_SIZE: "100"
      TENANT_PROJECTION_TARGET_LIMIT: "100"
      TENANT_PROJECTION_ACTIVITY_LIMIT: "50"
      TENANT_PROJECTION_MAX_ATTEMPTS: "20"
      JWT_SECRET: "dev-secret-change-in-production"
      MODEL_SECRET_KEY: "0123456789abcdef0123456789abcdef"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      TRUSTED_PROXY_CIDRS: ""
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: "10"
      AUTH_RATE_LIMIT_FAILURE_THRESHOLD: "5"
      AUTH_RATE_LIMIT_BLOCK_SECONDS: "300"
      AUTH_REGISTRATION_MAX_ATTEMPTS: "5"
      SENSITIVE_RATE_LIMIT_WINDOW_SECONDS: "60"
      SENSITIVE_RATE_LIMIT_MAX_ATTEMPTS: "20"
      SENSITIVE_RATE_LIMIT_BLOCK_SECONDS: "300"
      INVITATION_ACCEPT_RATE_LIMIT_MAX_ATTEMPTS: "10"
      AI_GATEWAY_RATE_LIMIT_WINDOW_SECONDS: "60"
      AI_GATEWAY_RATE_LIMIT_MAX_REQUESTS: "120"
      AI_GATEWAY_RATE_LIMIT_BLOCK_SECONDS: "60"
      AI_GATEWAY_INVOKE_TIMEOUT_SECONDS: "60"
      AI_GATEWAY_STREAM_TIMEOUT_SECONDS: "600"
      AI_GATEWAY_RESERVATION_RECOVERY_ENABLED: "true"
      AI_GATEWAY_RESERVATION_STALE_SECONDS: "1800"
      AI_GATEWAY_RESERVATION_POLL_SECONDS: "300"
      AI_GATEWAY_RESERVATION_LEASE_SECONDS: "60"
      AI_GATEWAY_RESERVATION_BATCH_SIZE: "100"
      AUDIT_RETENTION_WORKER_ENABLED: "true"
      AUDIT_RETENTION_DAYS: "365"
      AUDIT_RETENTION_POLL_SECONDS: "86400"
      AUDIT_RETENTION_BATCH_SIZE: "500"
      AUDIT_RETENTION_MAX_BATCHES: "20"
      BUSINESS_AI_PROVIDER_TYPE: ${BUSINESS_AI_PROVIDER_TYPE:-}
      BUSINESS_AI_MODEL: ${BUSINESS_AI_MODEL:-}
      BUSINESS_AI_MAX_TOKENS: ${BUSINESS_AI_MAX_TOKENS:-1800}
      MIGRATIONS_PATH: "migrations"
      TENANT_MIGRATIONS_PATH: "migrations/tenant"
      META_ORG_ENVIRONMENT: "development"
      META_ORG_MODE: "saas"
      META_ORG_DISTRIBUTION_MODE: "saas"
      META_ORG_LICENSE_MODE: "commercial"
      META_ORG_PLATFORM_ADMIN_EMAIL: "platform-admin@local.test"
      META_ORG_PLATFORM_ADMIN_PASSWORD_HASH: '$2a$10$/Dou0gOhCVFNGMitu8IUu.92HzEaG6iYWGxTTVUrSA1pkFvogvj22'
      SECURITY_KERNEL_URL: "http://security-kernel:8090"
      SECURITY_KERNEL_SHARED_SECRET: "dev-security-kernel-shared-secret"
      SECURITY_KERNEL_ENFORCEMENT_MODE: "blocking"
    depends_on:
      postgres:
        condition: service_healthy
      security-kernel:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
